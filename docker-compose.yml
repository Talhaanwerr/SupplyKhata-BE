version: '3.9'

services:
  # ─── MySQL ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-saas_db}
      MYSQL_USER: ${MYSQL_USER:-saas_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-saas_password}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (for future caching / BullMQ jobs) ─────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - '${PORT:-4700}:4700'
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-saas_user}:${MYSQL_PASSWORD:-saas_password}@mysql:3306/${MYSQL_DATABASE:-saas_db}
      PORT: 4700
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4700/api/v1/health']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  mysql_data:
  redis_data:
